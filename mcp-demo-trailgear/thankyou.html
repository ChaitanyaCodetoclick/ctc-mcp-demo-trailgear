</head>
<body>

<header>
  <a class="brand" href="index.html">TrailGear Outfitters</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="catalog.html">Catalog</a>
    <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<main>
  <h1>Thanks for your order</h1>
  <p class="lede">A confirmation would be on its way, if this shop were real.</p>

  <div id="order-summary"></div>

  <div class="actions">
    <a href="catalog.html">Keep shopping</a>
  </div>
</main>

<footer>Fictional retailer. Demo site for Marketing Cloud Personalization.</footer>

<script src="assets/js/app.js"></script>
</body>
</html>
